<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" role="img" aria-labelledby="t d">
  <title id="t">GraphBridge architecture</title>
  <desc id="d">Your application uses EF Core 10. GraphBridge.EntityFrameworkCore is the provider: a validated graph binding, reads from LINQ and Fluent Cypher to parameterized Cypher, writes from tracked entries to graph mutations, and schema, migration and native query services. It uses the official Neo4j.Driver to talk to Neo4j. Optional tooling reads the same EF model: Doctor, Verify and Query Lab; the mapping source generator; GraphBridge.Tool, the project template and the VS Code Query Lab viewer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1424"/><stop offset="1" stop-color="#0c1726"/></linearGradient>
    <marker id="ad" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="8" markerHeight="8" orient="0"><path d="M0 0L10 0L5 10z" fill="#3d5371"/></marker>
    <style>
      .sans{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
      .layer{fill:#0f1929;stroke:#27374d}
      .k{font-size:11px;font-weight:700;letter-spacing:1.5px;fill:#697d95}
      .h{font-size:17px;font-weight:700;fill:#e7effb}
      .p{font-size:13px;fill:#98a9bf}
      .box{fill:#132036;stroke:#2b3d58}
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="1279" height="519" rx="22" fill="url(#bg)" stroke="#27374d"/>
  <text x="40" y="52" class="sans" font-size="13" font-weight="700" letter-spacing="2" fill="#64e5ad">ARCHITECTURE</text>
  <text x="40" y="84" class="sans" font-size="24" font-weight="800" fill="#e7effb">A genuine EF Core provider with a thin graph binding</text>

  <g class="sans">
    <!-- runtime stack -->
    <rect class="layer" x="40" y="108" width="820" height="56" rx="12"/>
    <text x="60" y="130" class="k">YOUR APPLICATION</text>
    <text x="60" y="152" class="h">DbContext · DbSet&lt;T&gt; · LINQ · SaveChangesAsync · db.Cypher()</text>
    <line x1="450" y1="166" x2="450" y2="180" stroke="#3d5371" stroke-width="2" marker-end="url(#ad)"/>

    <rect class="layer" x="40" y="186" width="820" height="56" rx="12"/>
    <text x="60" y="208" class="k">REUSED</text>
    <text x="60" y="230" class="h">Entity Framework Core 10 <tspan class="p" font-weight="400">  model · change tracker · identity resolution · query compilation</tspan></text>
    <line x1="450" y1="244" x2="450" y2="258" stroke="#3d5371" stroke-width="2" marker-end="url(#ad)"/>

    <rect x="40" y="264" width="820" height="170" rx="14" fill="#0e2030" stroke="#2f6a8a"/>
    <text x="60" y="288" class="k" fill="#70d9fa" style="fill:#70d9fa">◆ GRAPHBRIDGE.ENTITYFRAMEWORKCORE · THE RUNTIME PACKAGE</text>
    <rect class="box" x="60" y="300" width="780" height="40" rx="9"/>
    <text x="450" y="326" text-anchor="middle" class="h" font-size="15">Validated graph binding <tspan class="p" font-weight="400">· nodes · references · associations · identified relationships</tspan></text>
    <rect class="box" x="60" y="350" width="384" height="70" rx="9"/>
    <text x="80" y="376" class="h" font-size="15">Read: LINQ and Fluent Cypher → Cypher</text>
    <text x="80" y="400" class="p">Translation · graph validation · EF shaping</text>
    <rect class="box" x="456" y="350" width="384" height="70" rx="9"/>
    <text x="476" y="376" class="h" font-size="15">Write: tracked entries → graph</text>
    <text x="476" y="400" class="p">Nodes and relationships · one transaction</text>
    <line x1="450" y1="436" x2="450" y2="450" stroke="#3d5371" stroke-width="2" marker-end="url(#ad)"/>

    <rect class="layer" x="40" y="456" width="820" height="44" rx="12" style="stroke:#2c6b55"/>
    <text x="60" y="484" class="h" font-size="15">Neo4j.Driver 6 → Neo4j <tspan class="p" font-weight="400">  official transport · parameters always · no automatic retries</tspan></text>

    <!-- tooling column -->
    <rect x="884" y="108" width="356" height="392" rx="14" fill="#14152a" stroke="#3c3670" stroke-dasharray="6 5"/>
    <text x="904" y="134" class="k" style="fill:#b6a3ff">OPTIONAL TOOLING · SAME EF MODEL</text>
    <rect class="box" x="904" y="150" width="316" height="72" rx="9"/>
    <text x="922" y="176" class="h" font-size="15">GraphBridge.Tooling</text>
    <text x="922" y="200" class="p">Doctor · Verify · Query Lab report</text>
    <rect class="box" x="904" y="234" width="316" height="72" rx="9"/>
    <text x="922" y="260" class="h" font-size="15">GraphBridge.Generators</text>
    <text x="922" y="284" class="p">Mapping source generator</text>
    <rect class="box" x="904" y="318" width="316" height="72" rx="9"/>
    <text x="922" y="344" class="h" font-size="15">GraphBridge.Tool</text>
    <text x="922" y="368" class="p">Ontology · SHACL · inspect · scaffold</text>
    <rect class="box" x="904" y="402" width="316" height="78" rx="9"/>
    <text x="922" y="428" class="h" font-size="15">Template · VS Code</text>
    <text x="922" y="452" class="p">dotnet new template ·</text>
    <text x="922" y="470" class="p">Query Lab viewer extension</text>
  </g>
</svg>
