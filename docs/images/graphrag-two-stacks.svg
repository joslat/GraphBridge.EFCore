      <circle cx="292" cy="0" r="5" class="comm"/><text x="304" y="4">Community</text>
      <circle cx="404" cy="0" r="5" class="gb"/><text x="416" y="4">José Luis Latorre: GraphBridge, AgentMemory</text>
      <rect x="720" y="-8" width="28" height="16" rx="4" class="plan"/><text x="758" y="4">Planned</text>
