name: ${GRAPHBRIDGE_ENTERPRISE_PROJECT:?Use Start-EnterpriseFixture.ps1 with explicit edition and license inputs}
services:
  neo4j:
    image: ${GRAPHBRIDGE_ENTERPRISE_IMAGE:?An explicit approved digest-pinned Enterprise image is required}
    labels:
      org.graphbridge.disposable: "true"
      org.graphbridge.enterprise: "true"
      org.graphbridge.fixture.id: ${GRAPHBRIDGE_ENTERPRISE_FIXTURE_ID:?Generated fixture identity required}
    ports:
      - "127.0.0.1:18687:7687"
      - "127.0.0.1:18474:7474"
    environment:
      NEO4J_ACCEPT_LICENSE_AGREEMENT: ${GRAPHBRIDGE_ENTERPRISE_LICENSE:?An explicit license choice is required}
      NEO4J_AUTH: neo4j/${GRAPHBRIDGE_ENTERPRISE_ADMIN_PASSWORD:?Generated admin credential required}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    tmpfs:
      - /data:uid=7474,gid=7474,mode=0700
      - /logs:uid=7474,gid=7474,mode=0700
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
    restart: "no"
    mem_limit: 2g
    cpus: 1.0
networks:
  default:
    labels:
      org.graphbridge.disposable: "true"
      org.graphbridge.enterprise: "true"
      org.graphbridge.fixture.id: ${GRAPHBRIDGE_ENTERPRISE_FIXTURE_ID:?Generated fixture identity required}
