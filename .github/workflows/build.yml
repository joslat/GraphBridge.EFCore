name: Public build and packages

on:
  # Test sources are tracked; this manual build job does not claim live acceptance.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Restore public source and sample dependencies
        run: dotnet restore GraphBridge.sln --locked-mode --disable-parallel
      - name: Build public source and samples
        run: dotnet build GraphBridge.sln --no-restore -c Release -m:1 -p:UseSharedCompilation=false -nodeReuse:false
      - name: Pack public libraries without publication
        run: dotnet pack GraphBridge.sln --no-build --no-restore -c Release -o .artifacts/packages
      - name: Check the compiled offline query gallery
        run: dotnet run --project samples/05-FluentCypher/FluentCypher.Sample.csproj --no-build --no-restore -c Release -- --check
